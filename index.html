
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Web Loader</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        input { width: 60%; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #output { margin-top: 20px; border: 1px solid #ccc; width: 100%; height: 500px; background: white; text-align: left; overflow: auto; padding: 10px; }
    </style>
</head>
<body>

    <h1>Personal Page Viewer</h1>
    <!-- The user types the website URL here -->
    <input type="text" id="targetUrl" placeholder="https://example.com">
    <button onclick="loadSite()">Go</button>

    <!-- This div will hold the loaded website content -->
    <div id="output">Website content will load here...</div>

    <script>
        async function loadSite() {
            const url = document.getElementById('targetUrl').value;
            const outputDiv = document.getElementById('output');
            
            if (!url) {
                alert('Please enter a URL');
                return;
            }

            outputDiv.innerHTML = "Loading...";

            try {
                // We use a public CORS proxy to bypass browser restrictions
                const proxyUrl = 'https://allorigins.win' + encodeURIComponent(url);
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                // data.contents contains the raw HTML of the website
                outputDiv.innerHTML = data.contents;
            } catch (error) {
                outputDiv.innerHTML = "Error loading site: " + error.message;
            }
        }
    </script>

</body>
</html>
